<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿墨墨打字通 - 快乐学打字</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFF8EE;
            --cream-deep: #FCEFD9;
            --ink: #5B4636;
            --ink-soft: #8A6F5C;
            --coral: #FF8A5C;
            --coral-deep: #E0633A;
            --sky: #4FB8E7;
            --sky-deep: #2E93C4;
            --grass: #6BCB77;
            --grass-deep: #48A757;
            --grape: #A57DE0;
            --grape-deep: #8258C7;
            --berry: #FF8FAB;
            --berry-deep: #E0678A;
            --honey: #FFC94D;
            --honey-deep: #E8A317;
        }

        body {
            font-family: 'Baloo 2', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--cream);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(255, 201, 77, 0.12) 0%, transparent 22%),
                radial-gradient(circle at 88% 12%, rgba(79, 184, 231, 0.10) 0%, transparent 24%),
                radial-gradient(circle at 85% 90%, rgba(107, 203, 119, 0.10) 0%, transparent 22%),
                radial-gradient(circle at 10% 85%, rgba(255, 143, 171, 0.10) 0%, transparent 22%);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .font-kids {
            font-family: 'Baloo 2', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            font-weight: 800;
        }
        .font-pinyin {
            font-family: 'Noto Sans SC', 'Baloo 2', sans-serif;
            letter-spacing: 0.08em;
        }
        .font-mono {
            font-family: 'JetBrains Mono', 'Baloo 2', monospace;
        }

        /* ============ 糖果按钮系统 ============ */
        .btn-candy {
            border-radius: 1.25rem;
            font-weight: 900;
            color: #fff;
            position: relative;
            transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
            user-select: none;
        }
        .btn-candy:hover { filter: brightness(1.06); }
        .btn-candy:active { transform: translateY(4px); }
        .btn-coral   { background: var(--coral);   box-shadow: 0 5px 0 var(--coral-deep); }
        .btn-coral:active   { box-shadow: 0 1px 0 var(--coral-deep); }
        .btn-sky     { background: var(--sky);     box-shadow: 0 5px 0 var(--sky-deep); }
        .btn-sky:active     { box-shadow: 0 1px 0 var(--sky-deep); }
        .btn-grass   { background: var(--grass);   box-shadow: 0 5px 0 var(--grass-deep); }
        .btn-grass:active   { box-shadow: 0 1px 0 var(--grass-deep); }
        .btn-grape   { background: var(--grape);   box-shadow: 0 5px 0 var(--grape-deep); }
        .btn-grape:active   { box-shadow: 0 1px 0 var(--grape-deep); }
        .btn-berry   { background: var(--berry);   box-shadow: 0 5px 0 var(--berry-deep); }
        .btn-berry:active   { box-shadow: 0 1px 0 var(--berry-deep); }
        .btn-honey   { background: var(--honey); color: #7A4A00; box-shadow: 0 5px 0 var(--honey-deep); }
        .btn-honey:active   { box-shadow: 0 1px 0 var(--honey-deep); }

        /* ============ 绘本卡片 ============ */
        .story-card {
            background: #fff;
            border-radius: 1.75rem;
            border: 3px solid #FFE8C8;
            box-shadow: 0 6px 0 rgba(222, 184, 135, 0.25);
        }

        /* ============ 通用动画 ============ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.045); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes shakeScreen {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        @keyframes floatScore {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-56px) scale(1.25); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10%) rotate(0deg); opacity: 1; }
            100% { transform: translateY(560px) rotate(720deg); opacity: 0; }
        }
        @keyframes popBurst {
            0% { transform: scale(0.4); opacity: 1; }
            70% { transform: scale(1.35); opacity: 0.9; }
            100% { transform: scale(1.7); opacity: 0; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.35; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        @keyframes cloudDrift {
            0% { transform: translateX(-8%); }
            100% { transform: translateX(108%); }
        }
        @keyframes waterWave {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-28px); }
        }
        @keyframes waterWave2 {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(28px); }
        }
        @keyframes splashRing {
            0% { transform: scale(0.25); opacity: 0.85; }
            100% { transform: scale(2.1); opacity: 0; }
        }
        @keyframes frogLeap {
            0% { transform: translate(0, 0) scale(1); }
            35% { transform: translate(calc(var(--leap-x) * 0.4), calc(var(--leap-y) * 0.5 - 58px)) scale(1.28); }
            65% { transform: translate(calc(var(--leap-x) * 0.75), calc(var(--leap-y) * 0.85 - 22px)) scale(1.12); }
            100% { transform: translate(var(--leap-x), var(--leap-y)) scale(1); }
        }
        @keyframes nitroFlame {
            0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.95; }
            50% { transform: scaleY(1.5) scaleX(0.85); opacity: 0.7; }
        }
        @keyframes speedLines {
            0% { transform: translateX(60px); opacity: 0; }
            30% { opacity: 0.9; }
            100% { transform: translateX(-260px); opacity: 0; }
        }
        @keyframes meteorSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes zzzFloat {
            0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: translate(18px, -42px) scale(1.15); }
        }
        @keyframes heartPop {
            0% { transform: scale(0.3); opacity: 0; }
            40% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9) translateY(-30px); opacity: 0; }
        }
        @keyframes bubbleRise {
            0% { transform: translateY(0) scale(0.6); opacity: 0.85; }
            100% { transform: translateY(-130px) scale(1.15); opacity: 0; }
        }
        @keyframes sway {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        @keyframes starSpin {
            from { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            to { transform: rotate(360deg) scale(1); }
        }
        @keyframes carRumble {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-1.5px) rotate(0.4deg); }
            50% { transform: translateY(0.5px) rotate(-0.3deg); }
            75% { transform: translateY(-0.8px) rotate(0.2deg); }
        }
        @keyframes exhaustPuff {
            0% { transform: scale(0.6) translateY(0); opacity: 0.9; }
            50% { transform: scale(1.3) translateY(14px); opacity: 0.6; }
            100% { transform: scale(2.0) translateY(28px); opacity: 0; }
        }
        @keyframes goldenFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes goldGlowPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.6), 0 0 16px rgba(251, 191, 36, 0.35), inset 0 0 4px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 16px rgba(245, 158, 11, 0.9), 0 0 28px rgba(251, 191, 36, 0.65), inset 0 0 8px rgba(251, 191, 36, 0.8); }
        }

        .animate-fade-in { animation: fadeInUp .35s ease-out; }
        .animate-float-y { animation: floatY 2.6s ease-in-out infinite; }
        .animate-breathe { animation: breathe 3.2s ease-in-out infinite; }
        .animate-wiggle { animation: wiggle 0.6s ease-in-out infinite; }
        .animate-shake-screen { animation: shakeScreen .38s ease; }
        .animate-float-score { animation: floatScore .9s ease-out forwards; }
        .animate-pop-burst { animation: popBurst .4s ease-out forwards; }
        .animate-twinkle { animation: twinkle 2s ease-in-out infinite; }
        .animate-sway { animation: sway 3s ease-in-out infinite; }
        .animate-star-spin { animation: starSpin 1.2s ease-in-out; }
        .animate-car-rumble { animation: carRumble 0.14s infinite ease-in-out; }
        .animate-exhaust-puff { animation: exhaustPuff 0.6s infinite ease-out; }
        .animate-frog-leap { animation: frogLeap .55s cubic-bezier(0.3, 0.8, 0.5, 1); }
        .animate-nitro { animation: nitroFlame 0.18s infinite ease-in-out; }
        .animate-meteor { animation: meteorSpin 5s linear infinite; }
        .animate-zzz { animation: zzzFloat 2.2s ease-out infinite; }
        .animate-heart-pop { animation: heartPop .8s ease-out forwards; }
        .animate-bubble-rise { animation: bubbleRise 1.6s ease-out infinite; }
        .animate-confetti { animation: confettiFall 1.8s ease-in forwards; }

        /* ============ 矮视口无滚动自适应 ============
           总原则「100% 缩放原生状态无滚动完整展示」的矮分辨率档位：
           仅当视口高度不足时对 main 内容区按页施加最小必要 zoom，
           导航栏与右下角宠物挂件保持原始大小；≥1021px 高的
           1920×1080 基线完全不受影响。
           zoom 取值 = (视口高 - 导航77px) / 该页最深状态实测高度 */
        @media (min-height: 821px) and (max-height: 1020px) {
            /* 1080 屏最大化浏览器窗口（视口约 965px） */
            main[data-active-tab="PET"]   { zoom: 0.85; }
            main[data-active-tab="STORY"] { zoom: 0.91; }
            main[data-active-tab="HABIT"] { zoom: 0.75; }
        }
        /* 好习惯·家长设置视图比常规视图更高：各档单独缩放（孩子常规视图不受影响） */
        @media (min-height: 1021px) {
            main[data-active-tab="HABIT"] { zoom: 0.84; }
            main[data-active-tab="HABIT"][data-parent-mode="1"] { zoom: 0.70; }
        }
        @media (min-height: 821px) and (max-height: 1020px) {
            main[data-active-tab="HABIT"][data-parent-mode="1"] { zoom: 0.68; }
        }
        @media (min-height: 701px) and (max-height: 820px) {
            main[data-active-tab="HABIT"][data-parent-mode="1"] { zoom: 0.52; }
        }
        @media (max-height: 700px) {
            main[data-active-tab="HABIT"][data-parent-mode="1"] { zoom: 0.48; }
        }
        @media (min-height: 701px) and (max-height: 820px) {
            /* 1366×768 全屏视口档 */
            main[data-active-tab="PRACTICE"] { zoom: 0.93; }
            main[data-active-tab="GAME"]     { zoom: 0.93; }
            main[data-active-tab="STORY"]    { zoom: 0.76; }
            main[data-active-tab="PET"]      { zoom: 0.71; }
            main[data-active-tab="HABIT"]    { zoom: 0.58; }
            main[data-active-tab="STATS"]    { zoom: 0.84; }
        }
        @media (max-height: 700px) {
            /* 小笔记本最大化窗口（视口更低时进一步缩放，宁小勿滚） */
            main[data-active-tab="PRACTICE"] { zoom: 0.84; }
            main[data-active-tab="GAME"]     { zoom: 0.84; }
            main[data-active-tab="STORY"]    { zoom: 0.70; }
            main[data-active-tab="PET"]      { zoom: 0.65; }
            main[data-active-tab="HABIT"]    { zoom: 0.52; }
            main[data-active-tab="STATS"]    { zoom: 0.77; }
        }

        /* ============ 宠物互动动作：每种道具一个特征鲜明的小动物动作 ============
           设计原则：动作轨迹/幅度/节奏互不重复，一眼能看出"在干什么"
           · 小饼干 petEatCookie   —— 低头小口啃咬（连续啄食+微转）
           · 小鱼干 petGulpFish    —— 蓄力下蹲→高高跃起→落地压扁（一口吞！）
           · 冰淇淋 petLickIcecream—— 仰头左右舔（向上够着舔）
           · 音乐盒 petDanceMusic  —— 律动摇摆舞（大幅左右倾+蹦跳）
           · 毛绒球 petChaseBall   —— 追球满地打滚（左右往返+720°翻滚）
           · 泡泡浴 petBathBubbles —— 高频甩水抖动（洗完澡甩水珠）
           · 梳毛刷 petBrush       —— 侧身蹭刷子+呼噜微颤（舒服眯眼）
           · 故事书 petRead        —— 低头看书缓缓点头（入迷晃脑）
           · 小窝觉 petSleep       —— 蜷成一团+慢慢呼吸（缩放+侧倾）
           · 摸摸头 petHappyHop    —— 开心连蹦两下（蹭手撒娇）
           · 附魔台 petSpinJoy     —— 原地旋转爆发（神力注入）
        ==================================================================== */
        @keyframes petEatCookie {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            10% { transform: translateY(13px) rotate(-6deg) scale(1.04, 0.96); }
            20% { transform: translateY(4px) rotate(0deg); }
            32% { transform: translateY(13px) rotate(6deg) scale(1.04, 0.96); }
            44% { transform: translateY(4px) rotate(0deg); }
            56% { transform: translateY(13px) rotate(-5deg) scale(1.04, 0.96); }
            68% { transform: translateY(4px) rotate(0deg); }
            82% { transform: translateY(11px) rotate(5deg) scale(1.03, 0.97); }
        }
        @keyframes petGulpFish {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            15% { transform: translateY(7px) scale(1.18, 0.8) rotate(0deg); }
            45% { transform: translateY(-52px) scale(0.92, 1.1) rotate(-16deg); }
            62% { transform: translateY(-30px) scale(0.95, 1.08) rotate(10deg); }
            78% { transform: translateY(5px) scale(1.24, 0.78) rotate(0deg); }
            100% { transform: translateY(0) scale(1) rotate(0deg); }
        }
        @keyframes petLickIcecream {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            20% { transform: translateY(-11px) rotate(-13deg) scale(1.02); }
            40% { transform: translateY(0) rotate(0deg); }
            60% { transform: translateY(-11px) rotate(13deg) scale(1.02); }
            80% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes petDanceMusic {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            15% { transform: translateY(-17px) rotate(-14deg) scale(1.05, 0.95); }
            30% { transform: translateY(0) rotate(0deg) scale(0.97, 1.03); }
            45% { transform: translateY(-17px) rotate(14deg) scale(1.05, 0.95); }
            60% { transform: translateY(0) rotate(0deg) scale(0.97, 1.03); }
            80% { transform: translateY(-11px) rotate(0deg) scale(1.08); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        @keyframes petChaseBall {
            0% { transform: translateX(-46px) rotate(0deg); }
            50% { transform: translateX(46px) rotate(360deg); }
            100% { transform: translateX(-46px) rotate(720deg); }
        }
        @keyframes petBathBubbles {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-13deg); }
            20% { transform: rotate(13deg); }
            30% { transform: rotate(-11deg); }
            40% { transform: rotate(11deg); }
            50% { transform: rotate(-9deg) translateY(-4px); }
            60% { transform: rotate(9deg); }
            70% { transform: rotate(-7deg); }
            80% { transform: rotate(7deg); }
            90% { transform: rotate(-4deg); }
        }
        @keyframes petBrush {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(17px) rotate(-14deg); }
            32% { transform: translateX(17px) rotate(-11deg); }
            44% { transform: translateX(17px) rotate(-14deg); }
            56% { transform: translateX(17px) rotate(-11deg); }
            72% { transform: translateX(-3px) rotate(2deg); }
        }
        @keyframes petRead {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-6deg) translateY(7px) scale(0.98, 1.02); }
            50% { transform: rotate(0deg) translateY(3px); }
            75% { transform: rotate(6deg) translateY(7px) scale(0.98, 1.02); }
        }
        @keyframes petSleep {
            0% { transform: scale(1) rotate(0deg) translateY(0); }
            22% { transform: scale(0.88, 0.82) rotate(-6deg) translateY(9px); }
            42% { transform: scale(0.9, 0.84) rotate(-6deg) translateY(9px); }
            58% { transform: scale(0.86, 0.8) rotate(-6deg) translateY(9px); }
            74% { transform: scale(0.9, 0.84) rotate(-6deg) translateY(9px); }
            100% { transform: scale(1) rotate(0deg) translateY(0); }
        }
        @keyframes petHappyHop {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            18% { transform: translateY(-21px) rotate(-8deg) scale(1.05); }
            36% { transform: translateY(0) rotate(0deg) scale(1); }
            55% { transform: translateY(-14px) rotate(8deg) scale(1.04); }
            72% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes petSpinJoy {
            from { transform: rotate(0) scale(1); }
            50% { transform: rotate(180deg) scale(1.18); }
            to { transform: rotate(360deg) scale(1); }
        }

        .animate-pet-cookie { animation: petEatCookie 1.1s ease-in-out; }
        .animate-pet-fish { animation: petGulpFish 1.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .animate-pet-icecream { animation: petLickIcecream 1.25s ease-in-out; }
        .animate-pet-dance { animation: petDanceMusic 1.35s ease-in-out; }
        .animate-pet-ball { animation: petChaseBall 1.6s ease-in-out; }
        .animate-pet-bath { animation: petBathBubbles 1.0s ease-in-out; }
        .animate-pet-brush { animation: petBrush 1.5s ease-in-out; }
        .animate-pet-sleep { animation: petSleep 1.9s ease-in-out; }
        .animate-pet-read { animation: petRead 1.8s ease-in-out; }
        .animate-pet-happyhop { animation: petHappyHop 1.1s ease-in-out; }
        .animate-pet-spinjoy { animation: petSpinJoy 0.9s ease-in-out; }
        .animate-pet-breathe { animation: breathe 3s ease-in-out infinite; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 故事词卡流光边框 */
        @keyframes borderFlowGlow {
            0% { box-shadow: 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.75); }
            25% { box-shadow: 0 0 0 2px #f97316, 0 0 12px rgba(249, 115, 22, 0.75); }
            50% { box-shadow: 0 0 0 2px #eab308, 0 0 14px rgba(234, 179, 8, 0.85); }
            75% { box-shadow: 0 0 0 2px #10b981, 0 0 10px rgba(16, 185, 129, 0.75); }
            100% { box-shadow: 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.75); }
        }
        .flowing-gold-card {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #fef08a, #d97706, #fbbf24, #f59e0b) !important;
            background-size: 300% 300% !important;
            animation: goldenFlow 2.2s linear infinite, goldGlowPulse 1.8s ease-in-out infinite !important;
        }
        .flowing-gold-pill,
        .flowing-word-box {
            background-color: #ffffff !important;
            color: #5B4636 !important;
            font-weight: 800 !important;
            animation: borderFlowGlow 1.8s linear infinite !important;
            border-color: transparent !important;
            transform: none !important;
            z-index: 10 !important;
        }
        /* AI 故事句子悬停：只保留深橙色流动外框，无填充 */
        .story-sentence:hover {
            background-color: transparent;
            animation: borderFlowGlow 1.8s linear infinite;
            border-radius: 6px;
        }
        @keyframes brushStroke { 0% { transform: translate(-58px, 0) rotate(-16deg); } 50% { transform: translate(58px, 8px) rotate(16deg); } 100% { transform: translate(-58px, 0) rotate(-16deg); } }
        @keyframes furFall { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 25% { opacity: 0.95; } 100% { opacity: 0; transform: translateY(96px) rotate(170deg); } }
        /* 任意元素选取模式：悬停十字准星指示 */
        body.pick-mode *:hover { outline: 2px dashed #A57DE0 !important; outline-offset: 1px; cursor: crosshair; }
        /* 排版调试面板：元素点选高亮 */
        body.tune-on [data-tune-target] { outline: 2px dashed transparent; }
        body.tune-on [data-tune-target]:hover { outline: 2px dashed #A57DE0; outline-offset: 2px; cursor: pointer; }
        body.tune-on [data-tune-target].tune-sel { outline: 3px solid #FF8A5C; outline-offset: 2px; border-radius: 10px; }
        /* 两行截断回退（CDN Tailwind 未生成 line-clamp 时兜底，萌宠道具卡高度依赖它） */
        .line-clamp-2 {
